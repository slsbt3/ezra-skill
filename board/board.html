<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ezra</title>
<!-- אייקון הלשונית: E כתומה על ריבוע כהה, כמו בכותרת. לא קוף, כדי שלא יתבלבל עם הלשוניות של שאר המערכות. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0d'/%3E%3Crect x='2' y='2' width='60' height='60' rx='12' fill='none' stroke='%23FF6B35' stroke-width='3'/%3E%3Cpath fill='%23FF6B35' d='M17 12h31v9H27v7h18v8H27v7h21v9H17z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik+Pixels&display=swap">
<style>
  /* לוח עזרא. הכותרת, הלוגו ומד השימוש כמו בלוח המקורי.
     הלוח קורא את status.json של כל שיחה ב־projects.json שבתיקיית עזרא, ואת usage.json. ההגדרות של ההתקנה: CONFIG בראש הסקריפט. */
  :root {
    color-scheme: dark;
    --bg: #0a0a0d; --panel: #121218; --panel-hi: #191920;
    --line: rgba(255, 255, 255, .08); --line-hi: rgba(255, 255, 255, .14);
    --text: #f4f4f6; --muted: #b4b4bd; --faint: #8c8c97;
    --orange: #FF6B35; --ok: #4ade80; --wait: #fbbf24; --idle: #9ca3af; --done: #60a5fa; --bad: #f87171; --none: #8c8c97;
    --font: 'Heebo', 'Segoe UI', Arial, sans-serif;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); scrollbar-gutter: stable; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55;
    padding: var(--s6) max(16px, 2vw) var(--s7); }
  .wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: var(--s5); }
  h1, h2 { margin: 0; text-wrap: balance; }
  h2 { font-size: 19px; font-weight: 700; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 6px; }

  /* הכותרת, כמו בלוח המקורי: הלוגו והטקסט מימין, מגבלת השימוש משמאל */
  header { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: var(--s5); align-items: start; }
  .head-main { display: grid; gap: var(--s3); min-width: 0; }
  .brand { display: flex; align-items: center; gap: var(--s2); color: var(--faint); font-size: 13px; letter-spacing: .04em; direction: ltr; justify-content: flex-end; }
  .brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--orange); display: inline-block; }
  h1.ezra { display: flex; align-items: center; gap: 14px; font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -.01em; }
  .ezra-monkey { width: 56px; height: 56px; flex: none; object-fit: contain; }
  .ezra-word { color: #ffffff; letter-spacing: 0; }
  .ezra-e { color: var(--orange); }
  .sub { margin: 0; color: var(--muted); max-width: 62ch; }
  .tally { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }
  .chip { display: inline-flex; align-items: center; gap: var(--s2); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-hi);
    background: transparent; cursor: pointer; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; transition: background .15s, border-color .15s, color .15s; }
  .chip:hover { background: var(--panel-hi); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--panel-hi); border-color: var(--text); color: var(--text); }
  .chip b { color: var(--text); font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .k-wait { color: var(--wait); } .k-ok { color: var(--ok); } .k-idle { color: var(--idle); } .k-done { color: var(--done); } .k-none { color: var(--none); }
  .chip.k-wait, .chip.k-ok, .chip.k-idle, .chip.k-none, .chip.k-done { color: var(--muted); }
  .chip.k-wait .dot { color: var(--wait); } .chip.k-ok .dot { color: var(--ok); } .chip.k-idle .dot { color: var(--idle); } .chip.k-none .dot { color: var(--none); } .chip.k-done .dot { color: var(--done); }
  .totals { color: var(--faint); font-size: 14px; font-variant-numeric: tabular-nums; }
  .usage { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: var(--s4); display: grid; gap: var(--s3); align-self: center; }
  .usage-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
  .usage-top h2 { font-size: 15px; font-weight: 700; }
  .usage-top span { color: var(--faint); font-size: 12.5px; direction: ltr; }
  .meter { display: grid; gap: 6px; }
  .meter-line { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); font-size: 13.5px; color: var(--muted); }
  .meter-line b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
  .bar { height: 6px; border-radius: 999px; background: var(--line-hi); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--ok); min-width: 2px; transition: width .4s; }
  .bar i.warn { background: var(--wait); } .bar i.bad { background: var(--bad); }
  .meter small { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .usage-foot { color: var(--faint); font-size: 12px; border-top: 1px solid var(--line); padding-top: var(--s2); }
  .usage-foot.stale { color: var(--wait); }

  /* שורת הרענון */
  .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: var(--s3); color: var(--faint); font-size: 13px; }
  .toolbar button, .start button { padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line-hi); background: var(--panel); cursor: pointer; }
  .toolbar button:hover { background: var(--panel-hi); }
  .toolbar button.need { border-color: var(--orange); color: var(--orange); }

  /* תפריט הכלים: שורה קבועה מתחת לכותרת, לכל הכלים המזדמנים והזמניים שעזרא מכין לבעלים.
     הרשימה ב־Ezra\tools\tools.json. כל כלי הוא קישור אחד שנפתח בלשונית חדשה. */
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .tools-label { font-weight: 700; font-size: 14px; white-space: nowrap; padding-inline-end: var(--s3); margin-inline-end: var(--s1); border-inline-end: 1px solid var(--line-hi); }
  .tool { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-hi); background: transparent;
    color: var(--text); text-decoration: none; font-size: 14px; cursor: pointer; transition: background .15s, border-color .15s; }
  .tool:hover { background: var(--panel-hi); border-color: var(--orange); }
  .tool .tag { font-size: 11px; line-height: 1.6; padding: 0 6px; border-radius: 6px; color: var(--wait); border: 1px solid color-mix(in srgb, var(--wait) 45%, transparent); }
  .tools .muted { font-size: 13px; }
  .start button { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 700; padding: 8px 20px; }

  main { display: grid; gap: var(--s5); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: var(--s4) var(--s5); }
  .forguy { border-color: color-mix(in srgb, var(--wait) 45%, transparent); background: linear-gradient(180deg, color-mix(in srgb, var(--wait) 9%, var(--panel)), var(--panel)); }
  .forguy h2 { color: var(--wait); margin-bottom: var(--s2); }
  .forguy ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 4px; }
  /* אין שום דבר שמחכה לבעלים: ירוק, וי שמצטייר, ופס אור שעובר */
  .forguy.clear { position: relative; overflow: hidden; border-color: color-mix(in srgb, var(--ok) 45%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--ok) 9%, var(--panel)), var(--panel)); }
  .forguy.clear h2 { color: var(--ok); }
  .forguy.clear::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, color-mix(in srgb, var(--ok) 16%, transparent) 50%, transparent 65%);
    transform: translateX(110%); animation: sweep 5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(110%); } 55%, 100% { transform: translateX(-110%); } }
  .clear-row { display: flex; align-items: center; gap: var(--s3); }
  .clear-row svg { width: 38px; height: 38px; flex: none; animation: breathe 3.2s ease-in-out .9s infinite; }
  .clear-row circle { fill: color-mix(in srgb, var(--ok) 14%, transparent); stroke: var(--ok); stroke-width: 2; }
  .clear-row path { fill: none; stroke: var(--ok); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw .8s ease-out .15s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes breathe { 0%, 100% { filter: drop-shadow(0 0 0 transparent); transform: scale(1); } 50% { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--ok) 70%, transparent)); transform: scale(1.06); } }
  .clear-row b { color: var(--text); font-weight: 700; }
  .clear-row span { color: var(--muted); font-size: 14px; }
  .muted { color: var(--faint); font-size: 14px; }
  /* מגרסה 2.0: לא לאתחל, הפעלות מחדש שמחכות, וקבצים משותפים שבעבודה */
  .alert { border-color: color-mix(in srgb, var(--bad) 60%, transparent); background: linear-gradient(180deg, color-mix(in srgb, var(--bad) 12%, var(--panel)), var(--panel)); }
  .alert h2 { color: var(--bad); margin-bottom: var(--s2); }
  .alert ul, .side ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 4px; }
  .sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: var(--s4); }
  .side h2 { font-size: 16px; margin-bottom: var(--s2); }
  .side .what { font-weight: 700; color: var(--text); direction: ltr; unicode-bidi: isolate; }
  .side li.conflict { color: var(--bad); }
  .side li.conflict .what { color: var(--bad); }
  .old { color: var(--wait); }
  /* "שיתופי עובדים" = the requests between workers + the shared files in work, one panel that folds to a single
     summary strip and opens again; the choice is kept in this browser */
  .shares h2 { font-size: 16px; margin: 0; }
  .fold { all: unset; cursor: pointer; display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
  .fold:focus-visible { outline: 2px solid var(--line-hi); outline-offset: 3px; border-radius: 6px; }
  .fold .cnt { color: var(--muted); font-weight: 400; font-size: 14px; }
  .fold .cnt.bad { color: var(--bad); }
  .fold .chev { transition: transform .15s; color: var(--muted); }
  .shares.shut .fold .chev { transform: rotate(90deg); }
  .shares .sides { margin-top: var(--s3); }
  .shares.shut .sides { display: none; }
  .shares .sub h3 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 var(--s2); }

  /* Ezra's own card: above everything, the whole width */
  .ezra-row .card { border: 1px solid var(--line-hi); border-inline-start: 4px solid var(--c);
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 9%, var(--panel)) 0%, var(--panel) 60%); }
  .ezra-row .card .name { font-size: 18px; }
  .ezra-row .items { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); column-gap: var(--s5); }

  /* כרטיס לכל שיחה, בצבע הקבוע של הפרויקט */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: var(--s4); }
  .card { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 10%, var(--panel)) 0%, var(--panel) 45%);
    border: 1px solid var(--line); border-inline-start: 4px solid var(--c); border-radius: 14px; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
  .card.nofile { opacity: .5; }
  /* מה שהשתנה מאז הרענון הקודם מהבהב 5 שניות: 5 פעימות של שנייה, בצבע הפרויקט */
  @keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 2px var(--c), 0 0 26px color-mix(in srgb, var(--c) 60%, transparent); } }
  .card.flash { animation: flash 1s ease-in-out 5; }
  @keyframes flashrow { 0%, 100% { background: transparent; } 50% { background: color-mix(in srgb, var(--orange) 20%, transparent); } }
  .feed li.flash, .forguy li.flash { animation: flashrow 1s ease-in-out 5; border-radius: 6px; }
  .top { display: flex; align-items: center; gap: var(--s2); }
  .top .emoji { font-size: 19px; line-height: 1; }
  .name { font-weight: 700; font-size: 16px; }
  .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .pill.k-wait { background: color-mix(in srgb, var(--wait) 14%, transparent); }
  .pill.k-ok { background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .pill.k-idle { background: color-mix(in srgb, var(--idle) 13%, transparent); }
  .pill.k-done { background: color-mix(in srgb, var(--done) 14%, transparent); }
  .pill.k-none { background: transparent; border: 1px dashed var(--line-hi); }
  .pill.k-ok .dot { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .now { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  .waiting { border: 1px solid color-mix(in srgb, var(--wait) 45%, transparent); background: color-mix(in srgb, var(--wait) 8%, transparent); color: var(--text); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  .items li { display: flex; gap: var(--s2); align-items: baseline; min-width: 0; overflow-wrap: anywhere; }
  .items li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line-hi); flex: none; transform: translateY(-2px); }
  .items li.g { color: var(--text); }
  .items li.g::before { background: var(--wait); }
  .small { font-size: 12.5px; color: var(--faint); overflow-wrap: anywhere; }
  .old { color: var(--wait); }
  .warn { font-size: 12.5px; color: var(--bad); }
  /* גרסת הסקיל של כל שיחה מול הגרסה האחרונה ב־Ezra\skill-version.json */
  .skill { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 6px; border: 1px solid var(--line-hi); color: var(--faint); margin-inline-start: 6px; }
  .skill.old { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 55%, transparent); background: color-mix(in srgb, var(--orange) 10%, transparent); }

  /* היומן */
  .feed { list-style: none; margin: 0; padding: 0; display: grid; }
  .feed li { display: grid; grid-template-columns: 96px 170px minmax(0, 1fr); gap: var(--s3); padding: var(--s2) 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .feed li:first-child { border-top: 0; }
  .feed time { color: var(--faint); font-variant-numeric: tabular-nums; }
  .feed .who { font-weight: 500; }
  .start { text-align: center; padding: var(--s7) var(--s5); border: 1px dashed var(--line-hi); border-radius: 14px; color: var(--muted); }
  .err { color: var(--bad); }
  footer { color: var(--faint); font-size: 13px; }

  /* תצוגת משרד: אותם נתונים, מצוירים כמשרד בפיקסל ארט. הכפתור בשורת הרענון מחליף בינה לבין הכרטיסים. */
  .office { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); align-items: start; }
  .scene [data-act^="open:"], .scene [data-act="blinds"] { cursor: pointer; }
  @keyframes pxrain { from { transform: translateY(0); opacity: 1; } to { transform: translateY(8px); opacity: .2; } }
  @keyframes pxflash { 0%, 92%, 96%, 100% { opacity: 0; } 94% { opacity: .7; } }
  /* Close-ups: the thing itself, big, over the office. */
  .closeup { position: absolute; inset: 6px; background: rgba(11, 10, 20, .7); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 5; }
  .cu { position: relative; max-width: 760px; width: 100%; max-height: 100%; overflow: auto; font-family: var(--font); font-size: 16px; line-height: 1.55; border: 4px solid #0b0a14; border-radius: 8px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
  .cu h3 { margin: 0 0 10px; font-size: 19px; font-weight: 800; padding-inline-end: 40px; }
  .cu p { margin: 6px 0; }
  .cu ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; }
  .cu-x { position: absolute; inset-inline-end: 10px; top: 8px; font-size: 18px; width: 34px; height: 34px; border-radius: 6px; border: 2px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
  .cu-note { background: transparent; border: 0; box-shadow: none; max-width: 420px; padding: 0; overflow: visible; }
  .cu-note .note, .cu-cork .note { position: relative; color: #3A2E00; padding: 26px 22px 18px; box-shadow: 4px 6px 0 rgba(0, 0, 0, .3); transform: rotate(-2deg); }
  .cu-note .note .key { font-weight: 800; font-size: 22px; margin-bottom: 8px; }
  .cu-note .note .txt { font-size: 18px; white-space: pre-line; overflow-wrap: anywhere; }
  .cu-note .note .from, .cu-cork .note .from { margin-top: 12px; font-size: 14px; opacity: .8; }
  .cu-note .cu-x { color: #3A2E00; z-index: 1; }
  .note .pin { position: absolute; top: -8px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #D9483B; box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  .cu-cork { background: #B98A5A; border-color: #7A5634; color: #2A1A08; }
  .cu-cork .notes { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 4px; }
  .cu-cork .note { width: 150px; padding: 20px 14px 12px; transform: rotate(var(--r)); cursor: pointer; }
  .cu-cork .note .key { font-weight: 800; font-size: 17px; }
  .cu-desk { background: #946644; border-color: #5A3A22; color: #FFF7EA; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
  .cu-desk h3 { grid-column: 1 / -1; }
  .cu-desk .tray { background: #3B3F4A; border-radius: 6px; padding: 12px; display: grid; gap: 8px; align-content: start; }
  .cu-desk .lbl { font-weight: 700; color: #D6DBE3; }
  .cu-desk .binder { display: flex; gap: 10px; align-items: stretch; background: #4A5060; border-radius: 4px; padding: 8px 10px 8px 8px; }
  .cu-desk .spine { flex: none; width: 14px; border-radius: 3px; box-shadow: inset 0 3px 0 rgba(255, 255, 255, .35); }
  .cu-desk .what { font-weight: 700; overflow-wrap: anywhere; }
  .cu-desk .from { font-size: 13px; color: #C3CAD6; }
  .cu-desk .side { display: grid; gap: 12px; align-content: start; }
  .cu-desk .phone, .cu-desk .cal { background: #6B4429; border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px; font-size: 14px; }
  .cu-desk .phone b { color: #FCA5A5; }
  .cu-desk .phone.on { background: #7F1D1D; box-shadow: 0 0 0 3px rgba(239, 68, 68, .45); }
  .cu-board { background: #FFFFFF; border-color: #8A92A0; color: #1E293B; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
  .cu-board .blue { color: #2563EB; } .cu-board .green { color: #16A34A; }
  .cu-board .now { font-weight: 700; color: #B45309; }
  .cu-board li.ask { color: #DC2626; font-weight: 700; }
  .cu-board .done { list-style: none; padding: 0; }
  .cu-cab { background: #B9C0CC; border-color: #6E7684; color: #1E2430; }
  .cu-cab li.clash { color: #B91C1C; }
  .cu-cab h3 + ul, .cu-cab h3 + p { margin-bottom: 14px; }
  .cu-tv { background: #1E1B2E; border-color: #000; color: #F4F4F6; padding: 14px; }
  .cu-tv .screen { background: #12345E; border-radius: 6px; padding: 14px 16px; }
  .cu-tv ul { list-style: none; padding: 0; }
  .cu-tv time { color: #9FC3FF; font-size: 13px; margin-inline-end: 6px; }
  .cu-help { background: #FFF3C4; border-color: #4A2E00; color: #3A2300; }
  .cu-worker { background: #FBF6E9; border-color: #6B4F3A; color: #2A2118; display: grid; gap: 12px; }
  .cu-worker .head { display: flex; gap: 14px; align-items: center; border-inline-start: 8px solid var(--c); padding-inline-start: 12px; }

  .cu-worker .em { font-size: 34px; line-height: 1; }
  .cu-worker .st { font-size: 14px; color: #6B5A44; }
  .cu-worker .now { margin: 0; font-weight: 600; }
  .cu-worker .sec h4 { margin: 0 0 6px; font-size: 14px; color: #6B5A44; font-weight: 800; }
  .cu-worker .binder { display: flex; gap: 10px; align-items: stretch; background: #F1E7D2; border-radius: 4px; padding: 8px 10px 8px 8px; margin-bottom: 6px; }
  .cu-worker .spine { flex: none; width: 12px; border-radius: 3px; box-shadow: inset 0 3px 0 rgba(255, 255, 255, .35); }
  .cu-worker .what { font-weight: 700; overflow-wrap: anywhere; }
  .cu-link { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; cursor: pointer; }
  .cu .out .pxm { display: block; margin-top: 6px; max-width: 100%; border: 2px solid #0b0a14; border-radius: 4px; background: #000000; }
  .cu .out video.pxm { width: 100%; max-height: 60vh; }
  .cu .out audio.pxm { width: 100%; border: 0; background: transparent; }
  .cu .out img.pxm { width: auto; max-height: 50vh; }
  .cu .out iframe.pxm { width: 100%; height: 60vh; background: #FFFFFF; }
  .cu .out .pxm-bad { margin-top: 4px; font-size: 14px; color: #8A3B12; }
  .cu .out .pxt { margin-top: 6px; max-height: 50vh; overflow: auto; background: #FFFFFF; border: 2px solid #0b0a14; border-radius: 4px; padding: 8px 12px; font-size: 14px; line-height: 1.5; color: #1E293B; }
  .cu .out .pxt h5 { margin: 10px 0 4px; font-size: 15px; } .cu .out .pxt p { margin: 4px 0; } .cu .out .pxt ul { gap: 2px; }
  .cu .out .pxt pre { white-space: pre-wrap; margin: 6px 0; font-size: 12.5px; } .cu .out .pxt pre.tbl { white-space: pre; overflow-x: auto; }
  .cu .out .pxt .pxt-cut { color: #8A7F6A; font-size: 13px; }
  .cu-lib { background: #FFFFFF; border-color: #8A92A0; color: #1E293B; width: min(560px, 92vw); }
  .cu-lib h3 { margin: 0 0 6px; font-size: 18px; } .cu-lib h4 { margin: 14px 0 4px; font-size: 14px; color: #64748B; font-weight: 700; }
  .cu-lib .lw { display: flex; align-items: center; gap: 6px; margin: 10px 0 2px; font-weight: 700; font-size: 14px; } .cu-lib .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .cu-lib .lst { list-style: none; padding: 0; margin: 0; display: block; }
  .cu-lib .lst li { display: flex; align-items: center; gap: 8px; padding: 7px 6px; border-bottom: 1px solid #EEF0F3; cursor: pointer; font-size: 14px; }
  .cu-lib .lst li:hover { background: #F4F6F9; }
  .cu-lib .lst i { width: 8px; height: 8px; border-radius: 50%; background: #EF4444; flex: none; } .cu-lib .lst i.r { background: transparent; }
  .cu-lib .lt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cu-lib .ld { flex: none; font-size: 12px; color: #94A3B8; } .cu-lib .ld.old { color: #B7865A; }
  .cu-lib .ok { color: #16A34A; flex: none; } .cu-lib .lb { flex: none; font-size: 12px; color: #2563EB; } .cu-lib .none { color: #94A3B8; margin: 0; }
  .cu-worker .out li { margin-bottom: 6px; } .cu-worker .out code { direction: ltr; unicode-bidi: embed; background: #EFE6D2; padding: 1px 4px; border-radius: 3px; }
  .cu-worker .foot { font-size: 13px; color: #8A7A62; border-top: 1px dashed #C9B48F; padding-top: 8px; }
  @media (max-width: 700px) { .cu-desk, .cu-board { grid-template-columns: minmax(0, 1fr); } }
  .scene { background: #141221; border: 3px solid #0b0a14; box-shadow: inset 0 0 0 2px #2c2846; border-radius: 6px; padding: 6px; }
  .scene { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; }
  .scene svg { width: 100%; max-width: 100%; height: auto; display: block; image-rendering: pixelated; }
  body.office-mode .wrap { max-width: none; }
  .warehouse { position: absolute; inset: 6px; background: #1b1d24; border: 3px solid #0b0a14; box-shadow: inset 0 0 0 2px #3a3f4c; display: flex; flex-direction: column; gap: 6px; padding: 8px; overflow: auto; }
  .warehouse .wh-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); font-family: 'Rubik Pixels', var(--font); font-size: 20px; color: #ffd23f; }
  .warehouse .wh-top b { font-weight: 400; }
  .warehouse button { font-family: var(--font); font-size: 14px; padding: 5px 12px; border-radius: 4px; border: 2px solid #c3cad6; background: #2a2f45; color: #f4efff; cursor: pointer; }
  .warehouse button:hover { border-color: #ffd23f; color: #ffd23f; }
  .scene .who { cursor: default; }
  .qlog { background: #1d1a2e; border: 3px solid #0b0a14; box-shadow: inset 0 0 0 2px #3a3460; border-radius: 6px; padding: var(--s4); display: grid; gap: var(--s3); font-size: 14px; }
  .qlog h2 { font-family: 'Rubik Pixels', var(--font); font-weight: 400; font-size: 24px; color: #f4efff; }
  .qlog h3 { margin: 0 0 6px; font-size: 12.5px; letter-spacing: .04em; font-weight: 700; }
  .qlog ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .q { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border: 2px solid; background: #26223a; overflow-wrap: anywhere; }
  .q .b { font-family: 'Rubik Pixels', var(--font); font-size: 18px; line-height: 1.1; flex: none; }
  .q .things { margin: 2px 0 0; padding-inline-start: 18px; display: grid; gap: 2px; list-style: decimal; }
  .q.gold { border-color: #ffd23f; background: #3a2a10; } .q.gold .b { color: #ffd23f; animation: pulse 1.2s ease-in-out infinite; }
  .q.silver { border-color: #d9deea; } .q.silver .b { color: #d9deea; }
  .q.flash { animation: flashrow 1s ease-in-out 5; }
  .qlog .ez { border: 2px solid #ff9a6e; background: #2e1f1a; padding: 8px 10px; }
  .qlog .ezdo { color: #ffd9c7; border-inline-start: 3px solid #ff9a6e; padding-inline-start: 8px; margin-bottom: 6px; }
  .qlog .ezcarry { margin-top: 3px; font-weight: 400; background: #3a2a22; border-radius: 4px; padding: 5px 8px; color: #f4efff; }
  .qlog .ezl { list-style: disc; padding-inline-start: 18px; margin-top: 4px; gap: 3px; }
  .qlog .h-ezra { color: #ff9a6e; }
  .qlog .h-gold { color: #ffd23f; } .qlog .h-later { color: #e9c98b; } .qlog .h-done { color: #5ce1a0; } .qlog .h-share { color: #b0b8c6; }
  .qlog .row { color: #d8cff0; font-size: 13.5px; }
  .qlog .row.bad { color: var(--bad); }
  .efft { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 10px; margin-top: 4px; }
  .qlog .legend .efft { grid-column: 1 / -1; margin-top: 0; }
  .efft > b { flex-basis: 100%; }
  .effc { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
  .effc svg { background: #EBDDC3; border-radius: 3px; padding: 2px 3px; }
  .effc small { font-size: 11px; }
  .qlog .legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; font-size: 12px; color: #b9b3d6; border-top: 2px solid #3a3460; padding-top: var(--s2); }
  .viewbtn[aria-pressed="true"] { border-color: var(--orange); color: var(--orange); }
  @keyframes pxbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes pxwave { 0%, 100% { transform: rotate(-25deg); } 50% { transform: rotate(20deg); } }
  @keyframes pxtype { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  @keyframes pxsteam { 0% { opacity: 0; transform: translateY(0); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-5px); } }
  @keyframes pxblink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .pxtip { position: fixed; z-index: 1000; max-width: 360px; background: #1d1a2e; color: #f4efff; border: 3px solid #0b0a14; box-shadow: inset 0 0 0 2px #3a3460, 0 8px 24px rgba(0, 0, 0, .45);
    border-radius: 6px; padding: 10px 14px; font-family: var(--font); font-size: 15px; line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; pointer-events: none; }
  .pxtip::first-line { font-weight: 700; color: #ffd23f; }
  /* The worker card (the owner, 23/11, "א + בר עבד היום"): its state in one word, the reason, and its day. */
  .pxtip.pxcard { white-space: normal; width: 300px; max-width: 300px; } .pxtip.pxcard::first-line { color: inherit; font-weight: inherit; }
  .pxcard .tc-top { display: flex; align-items: center; gap: 8px; }
  .pxcard .tc-nm { font-weight: 800; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pxcard .tc-pill { font-size: 14px; font-weight: 800; border-radius: 12px; padding: 1px 10px; white-space: nowrap; line-height: 1.5; }
  .tc-pill.you { background: #dc2626; color: #fff; } .tc-pill.work { background: #2563eb; color: #fff; } .tc-pill.other { background: #f59e0b; color: #2a1f10; }
  .tc-pill.cafe { background: #6b7280; color: #fff; } .tc-pill.done { background: #16a34a; color: #fff; }
  .pxcard .tc-why { margin-top: 8px; background: #fff4c2; color: #2a1f10; border-radius: 8px; padding: 7px 9px; font-size: 15px; line-height: 1.4; font-weight: 600; display: flex; gap: 7px; align-items: flex-start; }
  .pxcard .tc-why .t { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .pxcard .tc-why small { display: block; font-size: 12.5px; color: #8a6d1c; font-weight: 800; margin-top: 2px; }
  .pxcard .tc-doing { margin-top: 8px; font-size: 14.5px; line-height: 1.4; color: #e8e4ff; display: flex; gap: 7px; align-items: flex-start; }
  .pxcard .tc-doing .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pxcard .tc-wait { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 15px; font-weight: 700; }
  .pxcard .tc-wait .w { background: #2b2742; border: 1px solid #4a4370; border-radius: 14px; padding: 1px 9px; white-space: nowrap; }
  .pxcard .tc-lbl { margin-top: 10px; font-size: 12.5px; color: #a7a3c2; font-weight: 700; }
  .pxcard .tc-day em { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, .35); }
  .pxcard .tc-hrs { position: relative; height: 15px; margin-top: 2px; font-size: 11px; font-weight: 700; color: #a7a3c2; }
  .pxcard .tc-hrs span { position: absolute; top: 0; transform: translateX(50%); }
  .pxcard .tc-day { position: relative; height: 10px; margin-top: 3px; background: #3a3460; border-radius: 4px; overflow: hidden; }
  .pxcard .tc-day i { position: absolute; top: 0; bottom: 0; background: #5ce1a0; }
  @keyframes pxglint { 0%, 88%, 100% { opacity: 0; } 92% { opacity: 1; } }
  @keyframes pxtap { 0%, 30%, 60%, 100% { transform: translateY(0); } 15%, 45% { transform: translateY(-1px); } }
  @keyframes pxknock { 0%, 40%, 100% { transform: translateX(0); } 10%, 30% { transform: translateX(1px); } 20% { transform: translateX(-1px); } }
  @keyframes pxsip { 0%, 65%, 100% { transform: translateY(0); } 75%, 90% { transform: translateY(-4px); } }
  @keyframes pxbite { 0%, 70%, 100% { opacity: 1; } 75%, 85% { opacity: .35; } }
  @keyframes pxtalk { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes pxchatr { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 70% { opacity: .9; } 100% { opacity: 0; transform: translate(5px, -4px); } }
  @keyframes pxchatl { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 70% { opacity: .9; } 100% { opacity: 0; transform: translate(-5px, -4px); } }
  .scene .pxring { transform-box: fill-box; transform-origin: 50% 100%; animation: pxring 1.4s infinite; }
  @keyframes pxring { 0%, 50%, 100% { transform: rotate(0); } 8%, 24%, 40% { transform: rotate(-9deg); } 16%, 32% { transform: rotate(9deg); } }
  @keyframes pxfill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  @media (max-width: 900px) {
    .office { grid-template-columns: minmax(0, 1fr); }
    header { grid-template-columns: minmax(0, 1fr); }
    h1.ezra { font-size: 34px; }
    .ezra-monkey { width: 46px; height: 46px; }
    .feed li { grid-template-columns: 70px minmax(0, 1fr); }
    .feed .what { grid-column: 2; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<script>
'use strict';
// The settings of this installation. Each Ezra edits only this block in its own copy of the board (ezra skill, "הלוח של עזרא").
const CONFIG = {
  owner: 'הבעלים',                   // the owner's name: the waiting state is "מחכה ל<owner>", and owner items are [<owner>]
  roots: ['Projects'],               // the top folders the board asks for, one pick each; "folder" in projects.json starts with one of them
  shown: '',                         // how the folders are shown on the start screen, e.g. 'D:\\'
  ezra: ['Projects', 'Ezra'],        // the Ezra folder (projects.json, usage.json, tools), as a path under those folders
  city: null,                        // the owner's city, for the office window (weather, daylight, the colour of the blinds) and clock: { name: 'Haifa', lat: 32.79, lon: 34.99, tz: 'Asia/Jerusalem', blinds: '#D8C49E' }
  // More than one city: cities: [{ ... }, { ... }] instead of city. The first is the default; a click on the window lets the blinds down, changes to the next city and pulls them up again.
  // A city's view in the window, view: 'village' (a near red tiled roof, trees, a house behind) or 'city' (low houses of Jerusalem stone); without it, hills.
  clockStyle: 'wall',
  windows: [],                       // the owner's fixed hours, for the day clock in his room: [{ from: '18:00', to: '20:15', color: '#E53935', text: 'On air: no installs' }]
};
const WAIT = 'מחכה ל' + CONFIG.owner, TAG = '[' + CONFIG.owner + ']';
const SHOW = n => CONFIG.shown + n;
const STATES = ['עובד', WAIT, 'ממתין', 'הסתיים'];
const STATUS = {
  [WAIT]: { k: 'wait', rank: 0, label: 'מחכה לך' },
  'עובד': { k: 'ok', rank: 1, label: 'עובד' },
  'ממתין': { k: 'idle', rank: 2, label: 'ממתין' },
  'הסתיים': { k: 'done', rank: 3, label: 'הסתיים' },
  'none': { k: 'none', rank: 4, label: 'אין קובץ סטטוס' },
};
const ORDER = [WAIT, 'עובד', 'ממתין', 'הסתיים', 'none'];
const REFRESH_MS = 15000;
const OLD_HOURS = 24;
let root = null, timer = null, filter = null, last = null;
const FLASH_MS = 5000;
const flashUntil = {};
let prevSig = null, seenEvents = null;
const flashing = key => (flashUntil[key] || 0) > Date.now();
const evKey = (p, e) => p.id + '|' + e.at + '|' + e.text;

// Compares with the previous refresh: a card whose file changed, and a new log line, flash for 5 seconds. Nothing flashes on the first load.
function markChanges({ rows }) {
  const now = Date.now(), sig = {}, keys = new Set();
  for (const r of rows) {
    sig[r.p.id] = JSON.stringify(r.s);
    for (const e of (r.s && r.s.events) || []) if (e) keys.add(evKey(r.p, e));
  }
  if (prevSig) for (const id in sig) if (prevSig[id] !== sig[id]) flashUntil[id] = now + FLASH_MS;
  if (seenEvents) for (const k of keys) if (!seenEvents.has(k)) flashUntil['ev:' + k] = now + FLASH_MS;
  prevSig = sig;
  seenEvents = keys;
}

const $ = id => document.getElementById(id);
// The Ezra folder (projects.json, usage.json, tools), as a path under the picked folders.
const EZRA = CONFIG.ezra;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const statusOf = s => (s && STATUS[s.status]) ? s.status : 'none';

// The folder handle is kept in IndexedDB, so the next visit needs one "allow" click at most.
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open('ezra-board', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('h');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction('h', mode);
      const req = fn(tx.objectStore('h'));
      tx.oncomplete = () => resolve(req && req.result);
      tx.onerror = () => reject(tx.error);
    };
  });
}
// Storage keys of the picked folders; the first two keep the names of the older board, so an existing board does not ask again.
const KEY = i => ['rootB_ezra', 'rootB_sys'][i] || 'rootB_' + i;
const saveRoot = r => idb('readwrite', s => { let q; CONFIG.roots.forEach((n, i) => { q = s.put(r.parts[n], KEY(i)); }); return q; }).catch(() => {});
const loadOne = k => idb('readonly', s => s.get(k)).catch(() => null);
async function loadRoot() { const hs = []; for (let i = 0; i < CONFIG.roots.length; i++) { const h = await loadOne(KEY(i)); if (!h) return null; hs.push(h); } return joinRoot(hs); }
// Edge does not give a page the root of a drive, so each top folder in CONFIG.roots is picked once and they are joined here.
function joinRoot(hs) {
  const parts = {}; CONFIG.roots.forEach((n, i) => { parts[n] = hs[i]; });
  const both = async (fn, o) => { for (const h of hs) if ((await h[fn](o)) !== 'granted') return 'prompt'; return 'granted'; };
  return { parts,
    getDirectoryHandle: async n => { if (parts[n]) return parts[n]; throw new DOMException('אין ' + n, 'NotFoundError'); },
    queryPermission: o => both('queryPermission', o), requestPermission: o => both('requestPermission', o) };
}
let picked = [];

async function readJson(dir, ...parts) {
  let d = dir;
  for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
  const f = await (await d.getFileHandle(parts[parts.length - 1])).getFile();
  return JSON.parse((await f.text()).replace(/^\uFEFF/, ''));
}

// The board rules from the ezra skill, "הלוח: מצב וסימונים".
function check(s) {
  const out = [];
  if (!STATES.includes(s.status)) out.push(`מצב לא מוכר: "${s.status}"`);
  const guy = (s.items || []).filter(i => i && i.guy === true && !i.done && !i.later);
  const w = (s.waitingForGuy || '').trim();
  if (s.status === WAIT && !w) out.push(`"${WAIT}" בלי מה מחכה`);
  if (w && !guy.length) out.push(`כתוב מה ${WAIT}, אבל אין פריט ${TAG}`);
  if (guy.length && !w) out.push(`יש פריט ${TAG}, אבל "${WAIT}" ריק`);
  if (s.status === 'הסתיים' && guy.length) out.push(`"הסתיים" עם פריט ${TAG}`);
  if (s.touching != null && (!Array.isArray(s.touching) || s.touching.some(f => typeof f !== 'string'))) out.push('touching צריך להיות רשימה של נתיבים');
  if (s.restart != null && (!Array.isArray(s.restart) || s.restart.some(x => !x || !x.what))) out.push('restart צריך להיות רשימה של { what, why }');
  if (s.noReboot && !Date.parse(s.noReboot.until)) out.push('noReboot בלי until תקין');
  if (s.requests != null && (!Array.isArray(s.requests) || s.requests.some(q => !q || !q.to || !q.what))) out.push('requests צריך להיות רשימה של { to, what, when }');
  if (Array.isArray(s.restart) && s.restart.some(x => x && x.blocking) && !w) out.push(`מחכים להפעלה מחדש, אבל "${WAIT}" ריק`);
  return out;
}

const hm = new Intl.DateTimeFormat('he-IL', { hour: '2-digit', minute: '2-digit' });
const dm = new Intl.DateTimeFormat('he-IL', { day: '2-digit', month: '2-digit' });
function stamp(iso) { const t = Date.parse(iso); return t ? dm.format(new Date(t)) + ' ' + hm.format(new Date(t)) : ''; }
function ago(iso) {
  const t = Date.parse(iso);
  if (!t) return { text: 'בלי שעה', old: true };
  const m = Math.round((Date.now() - t) / 60000);
  const h = Math.round(m / 60), d = Math.round(m / 1440);
  const text = m < 1 ? 'עכשיו' : m < 60 ? `לפני ${m} דק׳` : m < 1440 ? (h === 1 ? 'לפני שעה' : `לפני ${h} שעות`) : (d === 1 ? 'לפני יום' : `לפני ${d} ימים`);

}
function left(iso) {
  const t = Date.parse(iso); if (!t) return '';
  const m = Math.round((t - Date.now()) / 60000);

  const d = Math.floor(m / 1440), hh = Math.floor((m % 1440) / 60), mm = m % 60;
  const when = (d ? dm.format(new Date(t)) + ' ' : '') + hm.format(new Date(t));
  const span = d ? d + ' ימים ו־' + hh + ' שע׳' : hh ? hh + ' שע׳ ו־' + mm + ' דק׳' : mm + ' דק׳';
  return 'מתאפס ב־' + when + ' · בעוד ' + span;
}

// The last card read of each worker. A card that cannot be read for a moment (its worker or the hook is writing it, and on a shared
// drive a file that is being replaced is missing or half written for a moment) keeps the last card read, for up to 3 minutes, so
// its worker does not vanish from the office and then jump back to the desk (the owner saw it; her card was missing for one read while it was written).
const pxGoodCard = {}, PX_CARD_GAP = 180e3;
async function load() {
  const list = (await readJson(root, ...EZRA, 'projects.json')).projects || [];
  let usage = null;
  try { usage = await readJson(root, ...EZRA, 'usage.json'); } catch (e) { /* Ezra has not written it yet */ }
  let skill = null;
  try { skill = (await readJson(root, ...EZRA, 'skill-version.json')).version || null; } catch (e) { /* no version file yet */ }
  let tools = [];
  try { tools = (await readJson(root, ...EZRA, 'tools', 'tools.json')).tools || []; } catch (e) { tools = e.name === 'SyntaxError' ? 'bad' : []; }
  // i keeps the order of projects.json, so each worker keeps the same desk in the office view.
  const rows = await Promise.all(list.map(async (p, i) => {
    try { const s = await readJson(root, ...p.folder.split(/[\\/]/), 'status.json'); pxGoodCard[p.id] = { s, at: Date.now() }; return { p, i, s }; }
    catch (e) {
      const g = pxGoodCard[p.id];
      if (g && Date.now() - g.at < PX_CARD_GAP) return { p, i, s: g.s, stale: true };
      return { p, i, s: null, bad: e.name === 'SyntaxError' };
    }
  }));
  rows.sort((a, b) => STATUS[statusOf(a.s)].rank - STATUS[statusOf(b.s)].rank
    || (Date.parse(b.s && b.s.updatedAt) || 0) - (Date.parse(a.s && a.s.updatedAt) || 0));
  // The archive (Ezra\archive.json): workers that were moved out of the office. The office view shows them in the warehouse.
  let archive = [];
  try { archive = (await readJson(root, ...EZRA, 'archive.json')).archived || []; } catch (e) { /* no archive file yet */ }
  // The hook's attendance log for today, for the punch clock in the office.
  let attendance = [];
  try { attendance = await pxReadLog(root); } catch (e) { /* no log yet */ }
  // The owner's answers from the office (answers.json in Ezra's folder), so a question shows what he answered and whether Ezra passed it on.
  let answers = [];
  try { answers = (await readJson(root, ...EZRA, 'answers.json')).answers || []; } catch (e) { /* none yet */ }
  // The shared files changed today (Ezra\shared-today.json, from scripts\shared-watch.js), for the filing cabinet in the office.
  let shared = null;
  try { shared = await readJson(root, ...EZRA, 'shared-today.json'); } catch (e) { /* none yet */ }
  return { rows, usage, skill, tools, archive, attendance, answers, shared };
}

// The tools menu, rebuilt only when tools.json changes.
// file is relative to the Ezra folder (or an http address); every tool is one link that opens in a new tab.
let toolsSig = null;
function renderTools(list) {
  const sig = JSON.stringify(list);
  if (sig === toolsSig) return;
  toolsSig = sig;
  const label = '<span class="tools-label">🧰 כלים</span>';
  if (list === 'bad') { $('tools').innerHTML = label + '<span class="warn">⚠ Ezra\\tools\\tools.json לא תקין</span>'; return; }
  const ok = (Array.isArray(list) ? list : []).filter(t => t && t.name && t.file && (!/:/.test(t.file) || /^https?:\/\//.test(t.file)));
  if (!ok.length) { $('tools').innerHTML = label + '<span class="muted">עוד אין כלים.</span>'; return; }
  $('tools').innerHTML = label + ok.map(t => {
    const tag = t.temp ? '<span class="tag">זמני</span>' : '';
    const tip = [t.desc, t.added && 'נוסף ' + t.added, t.until && 'עד ' + t.until].filter(Boolean).join(' · ');
    return `<a class="tool" href="${esc(t.file)}" target="_blank" rel="noopener" title="${esc(tip)}">${esc(t.icon || '🔗')} ${esc(t.name)}${tag}</a>`;
  }).join('');
}

// "1.10" is newer than "1.9": compare part by part as numbers.
function vcmp(a, b) {
  const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; }
  return 0;
}
const skillOld = (s, cur) => !!cur && (!s || !s.skill || vcmp(s.skill, cur) < 0);

// A restart that a worker waits on to finish is waiting for the owner too, even if the worker forgot to say so
//.
function blockingText(s) {
  return (s && Array.isArray(s.restart) ? s.restart : []).filter(x => x && x.what && x.blocking)
    .map(x => 'להפעיל מחדש את ' + x.what).join(' · ');
}
// A card that says "nothing" in words ("אין", "-", "none") does not wait for the owner (15/11: two workers sat on the bench for it).
const PX_NO_WAIT = /^(אין|לא|כלום|-|—|–|none|null|no|n\/a)\.?$/i;
function waitText(s) {
  const wf = String(s.waitingForGuy == null ? '' : s.waitingForGuy).trim();
  const own = (PX_NO_WAIT.test(wf) ? '' : wf) || (s.items || []).filter(i => i && i.guy && !i.done && !i.later).map(i => i.text).join(' · ');
  const rb = blockingText(s);
  return [own, rb && !/להפעיל מחדש|הפעלה מחדש|לאתחל|אתחול/.test(own) ? rb : ''].filter(Boolean).join(' · ');
}

function renderUsage(u) {
  const wins = u && Array.isArray(u.windows) ? u.windows.filter(w => w && typeof w.percent === 'number') : [];
  if (!wins.length) return;
  if (u.plan) $('usage-plan').textContent = 'Claude ' + u.plan;
  $('usage-meters').innerHTML = wins.map(w => {
    const p = Math.max(0, Math.min(100, Math.round(w.percent)));
    return `<div class="meter"><div class="meter-line"><span>${esc(w.label)}</span><b>${p}%</b></div>` +
      `<div class="bar"><i class="${p >= 85 ? 'bad' : p >= 60 ? 'warn' : ''}" style="width:${p}%"></i></div>` +
      (w.resetsAt ? `<small>${esc(left(w.resetsAt))}</small>` : '') + `</div>`;
  }).join('');
  const age = Date.parse(u.updatedAt) ? (Date.now() - Date.parse(u.updatedAt)) / 60000 : 0;
  $('usage-foot').className = 'usage-foot' + (age > 120 ? ' stale' : '');
  $('usage-foot').textContent = 'נבדק ' + ago(u.updatedAt).text + '. עזרא כותב את המספר בכל בדיקה.';
}

function renderTally(rows, cur) {
  const counts = {};
  rows.forEach(r => { const k = statusOf(r.s); counts[k] = (counts[k] || 0) + 1; });
  let html = `<button class="chip" aria-pressed="${!filter}" data-f="">הכול <b>${rows.length}</b></button>`;
  for (const s of ORDER) if (counts[s]) {
    const info = STATUS[s];
    html += `<button class="chip k-${info.k}" aria-pressed="${filter === s}" data-f="${esc(s)}"><span class="dot"></span>${esc(info.label)} <b>${counts[s]}</b></button>`;
  }
  $('tally').innerHTML = html;
  $('tally').querySelectorAll('button').forEach(b => b.onclick = () => { const f = b.dataset.f || null; filter = filter === f ? null : f; if (last) render(last); });
  let open = 0, guy = 0;
  rows.forEach(r => { const it = ((r.s && r.s.items) || []).filter(i => i && !i.done); open += it.length; guy += it.filter(i => i.guy && !i.later).length; });
  const stale = cur ? rows.filter(r => r.s && skillOld(r.s, cur)).length : 0;
  $('totals').textContent = `${open} פריטים פתוחים בסך הכול, ${guy} מהם מחכים לך` +
    (cur ? ` · סקיל עזרא ${cur}` + (stale ? `: ${stale} שיחות עוד לא מעודכנות` : ': כל השיחות מעודכנות') : '');
}

function card({ p, s, bad }, cur) {
  const style = `--c:${esc(p.color || '#8c8c97')}`;
  const info = STATUS[statusOf(s)];
  const pill = `<span class="pill k-${info.k}"><span class="dot"></span>${esc(bad ? 'קובץ פגום' : info.label)}</span>`;
  const top = `<div class="top"><span class="emoji">${esc(p.emoji)}</span><span class="name">${esc(p.name)}</span><span class="grow"></span>${pill}</div>`;
  const fl = flashing(p.id) ? ' flash' : '';
  if (!s) return `<article class="card nofile${fl}" style="${style}">${top}<div class="small">${esc(SHOW(p.folder))}\\status.json</div></article>`;
  const a = ago(s.updatedAt);
  const items = (s.items || []).filter(i => i && i.text);
  const problems = check(s);
  return `<article class="card${fl}" style="${style}">${top}` +
    (s.now ? `<p class="now">${esc(s.now)}</p>` : '') +
    (waitText(s) ? `<div class="waiting">מחכה לך: ${esc(waitText(s))}</div>` : '') +
    (items.length ? `<ul class="items">${items.map(i => `<li class="${i.guy && !i.done && !i.later ? 'g' : ''}">${esc(i.text)}</li>`).join('')}</ul>` : '') +
    (s.lastDone ? `<div class="small">נגמר לאחרונה: ${esc(s.lastDone)}</div>` : '') +
    (s.proof ? `<div class="small">הוכחה: ${esc(s.proof)}</div>` : '') +
    `<div class="small ${a.old ? 'old' : ''}">עודכן ${esc(a.text)} (${esc(stamp(s.updatedAt))})${s.machine || p.machine ? ' · ' + esc(s.machine || p.machine) : ''}` +
    (cur ? (skillOld(s, cur)
      ? `<span class="skill old" title="הגרסה האחרונה: ${esc(cur)}">${s.skill ? 'סקיל ' + esc(s.skill) + ' · ישן' : 'בלי גרסת סקיל'}</span>`
      : `<span class="skill">סקיל ${esc(s.skill)}</span>`) : '') + `</div>` +
    (problems.length ? `<div class="warn">⚠ לא לפי הכללים: ${esc(problems.join(' · '))}</div>` : '') +
    `</article>`;

const EZRA_ID = 'ezra', REQ_KEY = 'ezra-board-shares';
function reqOpen() { try { return localStorage.getItem(REQ_KEY) !== 'closed'; } catch (e) { return true; } }

// at all, and it is old: yellow in the mail, so its sender checks it is still needed. A worker in the archive cannot act on
// its requests any more, so they leave the mail (the owner, 18/11: "לא צריך לשמור מה שלא רלוונטי").

function render(data) {
  if (document.activeElement && document.activeElement.id === 'pxAns') { last = Object.assign(data, { answers: data.answers || (last && last.answers) }); return; }
  last = data;
  const { rows, usage, skill } = data;
  // Ezra is not a worker: her card is a row of its own above everything, and she is not in the count or the grid.
  const ezra = rows.find(r => r.p.id === EZRA_ID), workers = rows.filter(r => r.p.id !== EZRA_ID);
  renderUsage(usage);
  renderTally(workers, skill);
  // The office view uses the whole width of the window.
  document.body.classList.toggle('office-mode', viewMode() === 'office');
  if (viewMode() === 'office') { renderOffice(data); return; }

  const who = (p, extra) => `<b style="color:${esc(p.color || '#f4f4f6')}">${esc(p.emoji)} ${esc(p.name)}</b>${extra ? ': ' + esc(extra) : ''}`;
  let html = '';

  // Do not reboot: a long run that a Windows restart would kill. Shown until its "until" time.
  const noReb = rows.filter(r => r.s && r.s.noReboot && Date.parse(r.s.noReboot.until) > Date.now());
  if (noReb.length) {
    html += `<section class="panel alert"><h2>⛔ לא לאתחל</h2><ul>` + noReb.map(r =>
      `<li class="${flashing(r.p.id) ? 'flash' : ''}">${esc(r.s.noReboot.machine || r.p.machine || '')} עד ${esc(stamp(r.s.noReboot.until))} · ${who(r.p, r.s.noReboot.why)}</li>`).join('') + `</ul></section>`;
  }

  const forGuy = rows.filter(r => r.s && waitText(r.s));
  chimeIfNew(forGuy.map(r => r.p.id + '|' + waitText(r.s)));
  // The title says "מחכה לך" only when something is waiting.
  html += `<section class="panel forguy${forGuy.length ? '' : ' clear'}"><h2>${forGuy.length ? 'מחכה לך' : 'הכול זורם'}</h2>` + (forGuy.length
    ? `<ul>${forGuy.map(r => `<li class="${flashing(r.p.id) ? 'flash' : ''}">${esc(r.p.emoji)} <b style="color:${esc(r.p.color || '#f4f4f6')}">${esc(r.p.name)}</b>: ${esc(waitText(r.s))}</li>`).join('')}</ul>`
    : `<div class="clear-row"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="M12 20.5l5.5 5.5L28.5 14"/></svg>` +
      `<div><span>אין כרגע שום דבר שמחכה לך. כל השיחות עובדות או סיימו.</span></div></div>`) + `</section>`;

  // Ezra's row sits right under "מחכה לך" / "הכול זורם".
  if (ezra) html += `<section class="ezra-row">${card(ezra, skill)}</section>`;

  // Restarts for the next time, grouped by what has to restart, so one restart can serve several changes.
  // A blocking restart is already in "מחכה לך" (waitText), so it is not listed here again.
  const restarts = {};
  for (const r of rows) for (const x of (r.s && Array.isArray(r.s.restart) ? r.s.restart : [])) {
    if (!x || !x.what || x.blocking === true) continue;
    const k = String(x.what).trim().toLowerCase();
    (restarts[k] = restarts[k] || { what: String(x.what).trim(), list: [] }).list.push({ p: r.p, why: x.why });
  }
  // Shared files in work: two sessions on the same file is a conflict.
  const shared = {};
  for (const r of rows) for (const f of (r.s && Array.isArray(r.s.touching) ? r.s.touching : [])) {
    if (typeof f !== 'string' || !f.trim()) continue;
    const k = f.trim().toLowerCase().replace(/\//g, '\\');
    (shared[k] = shared[k] || { file: f.trim(), list: [] }).list.push(r.p);
  }

  const reqs = {};
  for (const r of rows) for (const q of reqsOf(r)) (reqs[q.to] = reqs[q.to] || []).push({ from: r.p, q });
  const qList = Object.keys(reqs);
  const rList = Object.values(restarts), sList = Object.values(shared).sort((a, b) => b.list.length - a.list.length);
  // Items put off to a later date, from every card: an item with "later", or one whose text says next week

  const later = [];
  for (const r of rows) for (const it of (r.s && Array.isArray(r.s.items) ? r.s.items : [])) {
    const t = typeof it === 'string' ? it : it && it.text;
    if (t && ((it && it.later) || LATER.test(t))) later.push({ p: r.p, t: String(t), when: it && it.later });
  }
  // Restarts that can wait for the next one the owner does anyway, and what waits for next week: open, side by side.
  if (rList.length || later.length) {
    html += `<div class="sides">`;
    if (rList.length) html += `<section class="panel side"><h2>בהפעלה מחדש הבאה</h2><ul>` + rList.map(g =>
      `<li><span class="what">${esc(g.what)}</span> · ${g.list.map(x => who(x.p, x.why)).join(' · ')}</li>`).join('') + `</ul></section>`;
    if (later.length) html += `<section class="panel side"><h2>לשבוע הבא</h2><ul>` + later.map(x =>
      `<li>${who(x.p, x.t)}${x.when ? ` · <span class="what">${esc(x.when)}</span>` : ''}</li>`).join('') + `</ul></section>`;
    html += `</div>`;
  }
  if (sList.length || qList.length) {
    const open = reqOpen(), qCount = qList.reduce((n, to) => n + reqs[to].length, 0), clash = sList.filter(g => g.list.length > 1).length;
    // Folded, the strip still says how many and shows a clash in red, so nothing urgent hides behind it.
    const sum = [qCount ? `${qCount} בקשות` : '', sList.length ? `${sList.length} קבצים משותפים` : ''].filter(Boolean).join(' · ');
    html += `<section class="panel shares${open ? '' : ' shut'}"><h2><button class="fold" data-fold="shares" aria-expanded="${open}">` +
      `<span>שיתופי עובדים</span><span class="cnt">${esc(sum)}</span>${clash ? `<span class="cnt bad">⚠ ${clash} התנגשות</span>` : ''}` +
      `<span class="chev" aria-hidden="true">▾</span></button></h2><div class="sides">`;
    if (qList.length) html += `<div class="side sub"><h3>בקשות בין עובדים</h3><ul>` + qList.map(to => {
      const owner = byId[to] ? who(byId[to]) : `<b>${esc(to)}</b>`;
      return reqs[to].map(({ from, q }) => `<li>${owner} ← ${who(from)}: ${esc(q.what)}${q.when ? ' · ' + esc(q.when) : ''}${reqTag(q) ? ` · <span class="old">⏳ ${esc(reqTag(q))}</span>` : ''}` +
        (q.approved ? ` · <span class="skill">אושר לבצע לבד, בפיקוח ${esc(byId[q.approved] ? byId[q.approved].name : q.approved)}</span>` : '') + `</li>`).join('');
    }).join('') + `</ul></div>`;
    if (sList.length) html += `<div class="side sub"><h3>קבצים משותפים בעבודה</h3><ul>` + sList.map(g =>
      `<li class="${g.list.length > 1 ? 'conflict' : ''}"><span class="what">${esc(g.file)}</span> · ${g.list.map(p => who(p)).join(' · ')}${g.list.length > 1 ? ' · ⚠ כמה שיחות על אותו קובץ' : ''}</li>`).join('') + `</ul></div>`;
    html += `</div></section>`;
  }

  const shown = workers.filter(r => !filter || statusOf(r.s) === filter);
  html += `<section class="grid">${shown.map(r => card(r, skill)).join('')}</section>`;

  const events = [];
  for (const { p, s } of rows) for (const e of ((s && s.events) || []).slice(0, 10)) {
    if (e && e.text && Date.parse(e.at)) events.push({ at: e.at, who: `${p.emoji} ${p.name}`, color: p.color, text: e.text, key: 'ev:' + evKey(p, e) });
  }
  events.sort((x, y) => Date.parse(y.at) - Date.parse(x.at));
  html += `<section class="panel"><h2 style="margin-bottom:8px">עדכונים אחרונים</h2>` + (events.length
    ? `<ul class="feed">${events.slice(0, 60).map(e => `<li class="${flashing(e.key) ? 'flash' : ''}"><time>${esc(stamp(e.at))}</time><span class="who" style="color:${esc(e.color || '#f4f4f6')}">${esc(e.who)}</span><span class="what">${esc(e.text)}</span></li>`).join('')}</ul>`
    : `<span class="muted">עוד אין אירועים בקבצים.</span>`) + `</section>`;

  setMain(html);
  $('refreshed').textContent = 'רוענן ' + new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// The office view (pixel art): the same data as the cards, drawn as an office. The choice is kept in this browser.
// Every worker keeps a desk in the order of projects.json. The session's emoji is on its screen, and its tie is in the emoji's color.
// Working: at the desk, typing and looking down. Not working (waiting for the owner, idle, done): in the coffee corner.
// Each thing that waits for the owner is a binder on the worker's desk. The lift opens the archive: a warehouse.
const VIEW_KEY = 'ezra-board-view';
function viewMode() { try { return localStorage.getItem(VIEW_KEY) === 'office' ? 'office' : 'cards'; } catch (e) { return 'cards'; } }
function showView() {
  const b = $('view'); if (!b) return;
  b.hidden = false;
  const office = viewMode() === 'office';
  b.textContent = office ? '▦ תצוגת כרטיסים' : '🕹️ תצוגת משרד';
  b.setAttribute('aria-pressed', String(office));
  b.title = office ? 'לחזור לכרטיסים' : 'לראות את השיחות כמשרד';
}
// #main is rebuilt only when its content changed, so the animations of the office do not restart on every refresh.

  lastMain = html;

  const media = {};

  try { const data = await load(); markChanges(data); render(data); renderTools(data.tools); }
  catch (e) {
    $('refreshed').textContent = 'שגיאה בקריאה: ' + (e.message || e.name);
    if (e.name === 'NotAllowedError' || e.name === 'SecurityError') { stop(); showStart('צריך לאשר שוב גישה לתיקייה.'); }
    else if (e.name === 'NotFoundError' || e.name === 'TypeMismatchError') { stop(); root = null; showStart('בתיקיות שנבחרו אין ' + EZRA.concat('projects.json').join('\\') + '.'); }
  }
}

function stop() { clearInterval(timer); timer = null; }
function go() {
  $('refresh').hidden = false;
  showSound();
  showView();
  refresh();
  stop();
  timer = setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
}

function showStart(msg, label) {
  const i = Math.min(picked.length, CONFIG.roots.length - 1), many = CONFIG.roots.length > 1;
  const names = CONFIG.roots.map(n => '<b>' + esc(SHOW(n)) + '</b>').join(' ומ־');
  lastMain = null;
  $('main').innerHTML = `<div class="start"><p>הלוח קורא מ־${names}. ${many ? 'בוחרים כל אחת מהן פעם אחת.' : 'בוחרים אותה פעם אחת.'}</p>` +
    `<button id="pick">${esc(label || ((many ? 'שלב ' + (i + 1) + ': ' : '') + 'בחר את ' + SHOW(CONFIG.roots[i])))}</button><p class="err">${esc(msg || '')}</p></div>`;
  $('pick').onclick = pick;
}

async function useRoot(h) {
  const i = picked.length, name = CONFIG.roots[i], step = CONFIG.roots.length > 1 ? 'בשלב ' + (i + 1) + ' ' : '';
  if (h.name !== name) { showStart(`בחרת את "${h.name}". ${step}בוחרים את ${SHOW(name)}.`); return; }
  if (name === EZRA[0]) {
    try { await readJson(h, ...EZRA.slice(1), 'projects.json'); }
    catch (e) { showStart('ב־' + SHOW(name) + ' אין ' + EZRA.slice(1).concat('projects.json').join('\\') + '.'); return; }
  }
  picked.push(h);
  if (picked.length < CONFIG.roots.length) { showStart(''); return; }
  root = joinRoot(picked); picked = [];
  await saveRoot(root);
  go();
}

async function pick() {
  if (root && (await root.requestPermission({ mode: 'read' })) === 'granted') {
    try { await readJson(root, ...EZRA, 'projects.json'); return go(); } catch (e) { root = null; }
  }
  try { await useRoot(await window.showDirectoryPicker({ id: ['ezra-board-ezra', 'ezra-board-sys'][picked.length] || 'ezra-board-' + picked.length, mode: 'read' })); }
  catch (e) { if (e.name !== 'AbortError') showStart('לא הצלחתי לפתוח את התיקייה: ' + (e.message || e.name)); }
}

$('refresh').onclick = refresh;
// The view button: cards or office. Both read the same files.
$('view').onclick = () => { try { localStorage.setItem(VIEW_KEY, viewMode() === 'office' ? 'cards' : 'office'); } catch (e) { /* no storage: the choice lasts until reload */ } showView(); if (last) render(last); };
// One click on "שיתופי עובדים" folds it to one strip, another opens it; #main is rebuilt on every refresh, so the click is caught here.
$('main').addEventListener('click', e => {
  if (!e.target.closest('[data-fold="shares"]')) return;
  try { localStorage.setItem(REQ_KEY, reqOpen() ? 'closed' : 'open'); } catch (err) { /* no storage: the list stays open */ }
  if (last) render(last);
});
$('sound').onclick = () => { if (audio && audio.state === 'running' && soundOn()) { try { localStorage.setItem(SOUND_KEY, 'off'); } catch (e) {} } else { try { localStorage.removeItem(SOUND_KEY); } catch (e) {} unlockAudio(); if (soundOn()) chime(); } showSound(); };
$('pick').onclick = pick;

(async () => {
  if (!window.showDirectoryPicker) { showStart('הדף צריך Edge או Chrome. בדפדפן הזה אי אפשר לקרוא תיקייה.'); $('pick').disabled = true; return; }
  showStart('');
  const saved = await loadRoot();
  if (!saved) return;
  root = saved;
  const perm = await saved.queryPermission({ mode: 'read' });
  if (perm === 'granted') go();
  else showStart('', 'אשר גישה ל־' + CONFIG.roots.map(SHOW).join(' ול־'));
})();
</script>
</body>
</html>
